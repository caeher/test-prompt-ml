services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_BACKEND: mbert
      MODEL_DIR: /app/models/mbert-sv
      HF_MODEL_REPO: caeher/mbert-sv
      CORS_ORIGINS: http://localhost:8080,http://localhost
      PYTHONPATH: /app
    volumes:
      - mbert_model:/app/models/mbert-sv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mbert_model:
